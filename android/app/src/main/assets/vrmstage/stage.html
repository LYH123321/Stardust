<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VRM Stage</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;}
  #app{width:100%;height:100%;}
  canvas{display:block;}
  #err{position:fixed;top:8px;left:8px;color:#f87171;font:12px monospace;white-space:pre-wrap;z-index:99;max-width:90%;text-shadow:0 0 3px #000;}
</style>
</head>
<body>
<div id="app"></div>
<pre id="err"></pre>
<script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/",
    "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils, VRMHumanBoneName } from '@pixiv/three-vrm';

const errEl = document.getElementById('err');
function report(kind, msg){ try{ Live2DBridge.onNativeLog(kind + ': ' + msg);}catch(e){} try{ errEl.textContent += kind+': '+msg+'\n'; }catch(_){} }
      function reportOk(ok){ try{ Live2DBridge.onModelLoaded(ok); }catch(e){} }
window.addEventListener('error', e => report('JSERR', e.message));

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30.0, innerWidth/innerHeight, 0.1, 20.0);
camera.position.set(0, 1.35, 2.2);

const light = new THREE.DirectionalLight(0xffffff, Math.PI);
light.position.set(1.0, 2.0, 0.5).normalize();
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, Math.PI * 0.5));

let vrm = null;
let clock = new THREE.Clock();
let expressionTargets = {};   // 情绪 → 目标强度
let currentExpr = {};
const EXPR_MAP = {            // 星尘 Emotion → VRM 表情（标准 blendshape 名）
  HAPPY: 'happy', SAD: 'sad', ANGRY: 'angry', SURPRISED: 'surprised',
  RELAXED: 'relaxed', NEUTRAL: 'neutral',
};
let blinkT = 0, blinkNext = 2;

function setExpr(name, v){ if(vrm && vrm.expressionManager){ try{ vrm.expressionManager.setValue(name, v); }catch(e){} } currentExpr[name] = v; }

// ===== 对外 API =====
window.StageAPI = {
  async loadModel(url){
    try{
      const loader = new GLTFLoader();
      loader.register(parser => new VRMLoaderPlugin(parser));
      const gltf = await loader.loadAsync(url);
      const v = gltf.userData.vrm;
      if(!v) throw new Error('not a VRM file');
      if(vrm){ scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.combineSkeletons(gltf.scene);
      v.scene.traverse(o => { o.frustumCulled = false; });
      v.lookAt.target = camera; // 注视镜头
      scene.add(v.scene);
      vrm = v;
      // 站姿 A-pose 修正：VRM0 需要归一化
      try{ v.humanoid.getNormalizedBoneNode(VRMHumanBoneName.LeftUpperArm).rotation.z = 1.2; v.humanoid.getNormalizedBoneNode(VRMHumanBoneName.RightUpperArm).rotation.z = -1.2; }catch(e){}
      v.update(clock.getDelta());
      report('OK', 'loaded ' + url);
      reportOk(true);
      return true;
    }catch(e){ report('LOADFAIL', e.message || String(e)); reportOk(false); return false; }
  },
  // 星尘情绪：字符串（HAPPY/SAD/...），渐变过渡
  setEmotion(emo){
    const target = EXPR_MAP[String(emo).toUpperCase()] || 'neutral';
    for(const k in EXPR_MAP) expressionTargets[EXPR_MAP[k]] = (EXPR_MAP[k] === target) ? 1.0 : 0.0;
    expressionTargets.neutral = (target === 'neutral') ? 1.0 : 0.0;
    report('EMO', emo + ' -> ' + target);
  },
  setRotation(yaw){ if(vrm){ try{ vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.Hips).rotation.y = yaw; }catch(e){} } },
  setCameraPos(x,y,z){ camera.position.set(x,y,z); },
  screenshot(){ try{ renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); }catch(e){ return ''; } },
};

// 渲染循环：表情渐变 + 待机眨眼 + 微摆动
function tick(){
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  if(vrm){
    // 表情渐变
    for(const k in expressionTargets){
      const cur = currentExpr[k] || 0;
      const nv = cur + (expressionTargets[k] - cur) * Math.min(1, dt * 6);
      if(Math.abs(nv - cur) > 0.001) setExpr(k, nv);
    }
    // 待机眨眼
    blinkT += dt;
    if(blinkT > blinkNext){ blinkT = 0; blinkNext = 2 + Math.random() * 3; }
    const bp = blinkT < 0.15 ? Math.sin(blinkT / 0.15 * Math.PI) : 0;
    setExpr('blink', bp);
    // 呼吸微摆
    try{ vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.Spine).rotation.z = Math.sin(clock.elapsedTime * 1.2) * 0.02; }catch(e){}
    vrm.update(dt);
  }
  renderer.render(scene, camera);
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
report('OK', 'stage ready');
</script>
</body>
</html>
